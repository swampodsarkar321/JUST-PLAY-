<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GBA Play — Nokia Vault</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#05070f] text-slate-100 min-h-screen">
<header class="flex items-center gap-3 px-4 py-3 border-b border-white/5"><a href="gba.html" class="text-sm opacity-70">← Arena</a>
<div class="ml-auto flex items-center gap-3 text-sm"><span id="timer" class="bg-sky-500/15 border border-sky-500/30 rounded-full px-3 py-1">30:00 free</span><span class="bg-amber-400/10 border border-amber-400/30 rounded-full px-3 py-1">🪙 <b id="coins">0</b></span></div></header>
<main class="p-4 max-w-3xl mx-auto space-y-4">
<div class="rounded-3xl overflow-hidden border border-white/10 bg-black">
<div id="game"></div></div>
<!-- Rewarded ad modal -->
<div id="lock" class="hidden rounded-3xl p-8 text-center bg-amber-400/10 border border-amber-400/30">
<h2 class="text-xl font-bold">Free 30 min over!</h2>
<div id="adbox" class="my-4 rounded-2xl border border-dashed border-white/20 py-8 text-sm opacity-70">REWARDED AD SLOT<br><span class="text-xs">(paste network code — see ADS.md)</span></div>
<p class="text-xs opacity-60" id="admsg">Watch the ad to the end, then claim.</p>
<div class="flex gap-2 justify-center mt-3"><button onclick="watchAd()" class="bg-sky-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm">▶ Watch Ad</button><button id="claim" onclick="claim()" disabled class="bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm opacity-40">Claim +30 🪙</button></div></div>
</main>
<script>
/* EmulatorJS (CDN, no BIOS needed for GBA) */
window.EJS_player='#game';window.EJS_core='gba';window.EJS_gameName='game';
window.EJS_pathtodata='https://cdn.emulatorjs.com/stable/data/';
const q=new URLSearchParams(location.search);
const ROMS={}; // fill: ROMS[0]='https://.../emerald.gba'
if(q.get('custom')){EJS_gameUrl=sessionStorage.getItem('jv_gba');document.title=sessionStorage.getItem('jv_gba_name')||'GBA';}
else if(ROMS[q.get('g')])EJS_gameUrl=ROMS[q.get('g')];
let coins=+(localStorage.getItem('jv_coins')||100),secs=30*60;
function paint(){document.getElementById('coins').innerText=coins;
const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');
document.getElementById('timer').innerText=secs>0?`${m}:${s} free`:'Coins play';}
paint();
setInterval(()=>{if(secs>0){secs--;if(secs===0)document.getElementById('lock').classList.remove('hidden');}paint();},1000);
/* Rewarded ad: real network er callback e claim enable koren (ADS.md) */
function watchAd(){document.getElementById('admsg').innerText='Playing ad… (demo 5s)';setTimeout(()=>{document.getElementById('claim').disabled=false;document.getElementById('claim').classList.remove('opacity-40');document.getElementById('admsg').innerText='Done! Claim your coins.';},5000);}
function claim(){coins+=30;localStorage.setItem('jv_coins',coins);document.getElementById('lock').classList.add('hidden');document.getElementById('claim').disabled=true;paint();}
</script>
<script src="https://cdn.emulatorjs.com/stable/data/loader.js"></script>
</body></html>
