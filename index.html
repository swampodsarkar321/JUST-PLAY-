<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultStation 5</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}
body{background:#0b0e1a}
#bg{position:fixed;inset:0;transition:background 1s;background:radial-gradient(900px 500px at 70% 15%,rgba(0,112,209,.35),transparent),radial-gradient(700px 500px at 20% 90%,rgba(120,40,180,.25),transparent)}
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .8s}
.hrow{scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.tile{transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.tile.sel{transform:scale(1.12);border-color:#fff;box-shadow:0 12px 50px rgba(255,255,255,.25)}
#cc{backdrop-filter:blur(30px);background:rgba(10,14,28,.75)}
.ccbtn:hover{background:rgba(255,255,255,.14)}
#player{backdrop-filter:blur(10px)}</style></head>
<body class="text-white" onload="lucide.createIcons()">
<div id="bg"></div>
<div id="boot"><div class="text-center"><div class="text-5xl font-light tracking-tight">VaultStation<span class="align-super text-lg">®5</span></div><div class="text-xs opacity-50 mt-3">press anything…</div></div></div>
<!-- top bar -->
<div class="fixed top-0 inset-x-0 z-30 flex items-center gap-5 px-6 md:px-12 py-4">
<div class="flex items-center gap-2"><span class="w-8 h-8 rounded-full grid place-items-center font-bold text-slate-950" style="background:linear-gradient(135deg,#fff,#9db4d0)">V</span></div>
<div class="flex gap-6 text-sm ml-4"><button class="font-bold border-b-2 border-white pb-0.5">Games</button><button class="opacity-60 hover:opacity-100" onclick="tabMedia()">Media</button></div>
<div class="ml-auto flex items-center gap-5 text-sm">
<button onclick="adRewarded(()=>{coins+=50;saveCoins();toast('+50 coins');})" class="flex items-center gap-1.5 opacity-80 hover:opacity-100"><i data-lucide="coins" class="w-4 h-4"></i><b id="coins">100</b></button>
<button class="opacity-80 hover:opacity-100"><i data-lucide="search" class="w-5 h-5"></i></button>
<button class="opacity-80 hover:opacity-100"><i data-lucide="settings" class="w-5 h-5"></i></button>
<span id="clock" class="tabular-nums opacity-90">--:--</span></div></div>
<!-- home -->
<div id="home" class="relative z-10 h-full flex flex-col justify-center px-6 md:px-12 pt-10">
<div class="text-xs tracking-[.25em] opacity-60 mb-1" id="sysname">GBA</div>
<h1 id="gname" class="text-4xl md:text-6xl font-bold mb-5">Game</h1>
<div id="row" class="hrow flex gap-4 overflow-x-auto pb-4 pt-6 -mt-6"></div>
<div class="flex gap-8 mt-6 text-sm opacity-80">
<div class="flex items-center gap-2"><span class="w-7 h-7 rounded-full border border-white/40 grid place-items-center text-xs">✕</span> Play</div>
<div class="flex items-center gap-2"><span class="w-7 h-7 rounded-full border border-white/40 grid place-items-center text-xs">◯</span> Details</div>
<div class="flex items-center gap-2"><i data-lucide="gamepad-2" class="w-5 h-5"></i> PS Button: Control Center</div></div></div>
<!-- fullscreen player -->
<div id="player" class="hidden fixed inset-0 z-40 bg-black/95 flex-col">
<div class="flex items-center gap-3 px-4 py-2.5 text-sm border-b border-white/10">
<button onclick="home()" class="flex items-center gap-1.5 opacity-80 hover:opacity-100"><i data-lucide="chevron-left" class="w-4 h-4"></i><span id="pname">Game</span></button>
<span id="ptimer" class="ml-auto text-xs bg-sky-500/15 border border-sky-500/30 rounded-full px-3 py-1">30:00</span>
<button onclick="toggleCC()" class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 rounded-full px-4 py-1.5 text-xs font-bold"><i data-lucide="gamepad-2" class="w-4 h-4"></i>PS</button></div>
<div class="flex-1 relative"><iframe id="emu" class="absolute inset-0 w-full h-full border-0" allow="autoplay;fullscreen"></iframe></div></div>
<!-- control center -->
<div id="cc" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 rounded-2xl border border-white/10 px-3 py-2.5 flex items-center gap-1.5">
<button onclick="toggleCC()" class="ccbtn rounded-xl px-4 py-2 text-xs">Resume</button>
<button onclick="fsEmu()" class="ccbtn rounded-xl px-4 py-2 text-xs">Fullscreen</button>
<button onclick="adRewarded(()=>{coins+=50;saveCoins();toast('+50 coins');})" class="ccbtn rounded-xl px-4 py-2 text-xs">+50 coins (ad)</button>
<button onclick="home()" class="ccbtn rounded-xl px-4 py-2 text-xs text-red-300">Quit game</button></div>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-white text-slate-950 text-sm font-bold px-5 py-2.5 rounded-full"></div>
<script src="ads.js"></script>
<script>
const SYS={
gba:{name:'GBA',color:'#7c3aed',games:[['Pokemon Emerald','RPG'],['Mario Kart SC','Racing'],['Zelda Minish Cap','Adventure'],['Metroid Fusion','Action']]},
gbc:{name:'GAME BOY',color:'#06b6d4',games:[['Pokemon Crystal','RPG'],['Zelda LA','Adventure'],['Tetris','Puzzle'],['Mario Land 2','Platformer']]},
nes:{name:'NES',color:'#ef4444',games:[['Mario Bros 3','Platformer'],['Contra','Action'],['Zelda','Adventure'],['Tetris','Puzzle']]},
snes:{name:'SUPER NES',color:'#f59e0b',games:[['Mario World','Platformer'],['Zelda LTTP','Adventure'],['Donkey Kong','Platformer'],['SF II','Fighting']]},
gen:{name:'GENESIS',color:'#10b981',games:[['Sonic 2','Platformer'],['Streets of Rage','Action'],['MK','Fighting'],['Aladdin','Platformer']]}};
const ROMS={};
const ARTS=['⚡','🏎️','🗡️','🚀','💎','🐍','⚽','🌟','🌀','👾'];
let coins=+(localStorage.getItem('vo_coins')||100),SI=0,GI=0,SECS=30*60;
const SIDS=Object.keys(SYS);
function saveCoins(){localStorage.setItem('vo_coins',coins);document.getElementById('coins').innerText=coins;}
function toast(t){const e=document.getElementById('toast');e.innerText=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200);}
setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),850);},1600);
setInterval(()=>{clock.innerText=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});},1000);
saveCoins();draw();
function tiles(){const s=SYS[SIDS[SI]];return s.games.map((g,i)=>({sys:SIDS[SI],i,name:g[0],cat:g[1],color:s.color}));}
function draw(){
  const s=SYS[SIDS[SI]];
  bg.style.background=`radial-gradient(900px 500px at 70% 15%,${s.color}55,transparent),radial-gradient(700px 500px at 20% 90%,rgba(120,40,180,.25),transparent)`;
  sysname.innerText=s.name;
  const T=tiles(),cur=T[GI]||T[0];GI=T.indexOf(cur);if(GI<0)GI=0;
  gname.innerText=T[GI]?T[GI].name:'';
  row.innerHTML=T.map((t,i)=>`<button onclick="sel(${i})" ondblclick="play()" id="t${i}" class="tile shrink-0 w-36 md:w-48 text-left rounded-2xl overflow-hidden border-2 ${i===GI?'sel border-white':'border-transparent opacity-70'}"><div class="h-36 md:h-48 grid place-items-center text-6xl" style="background:linear-gradient(150deg,${t.color},#0b1020)">${ARTS[(SI*4+i)%ARTS.length]}</div><div class="p-2 bg-black/60 text-xs font-bold truncate">${t.name}</div></button>`).join('')
  +`<button onclick="upload()" class="tile shrink-0 w-36 md:w-48 rounded-2xl border-2 border-dashed border-white/25 grid place-items-center h-[228px] md:h-[276px] opacity-70"><span class="text-center text-xs">+<br>My ROM</span></button>`;
  const el=document.getElementById('t'+GI);if(el)el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function sel(i){GI=i;draw();}
function tabMedia(){toast('Media gallery coming soon');}
function upload(){const inp=document.createElement('input');inp.type='file';inp.onchange=e=>{const f=e.target.files[0];if(f)playCustom(f.name,URL.createObjectURL(f));};inp.click();}
function playCustom(name,url){const p=document.getElementById('player');p.classList.remove('hidden');p.classList.add('flex');pname.innerText=name;emu.src=`emu.html?core=gba&rom=${encodeURIComponent(url)}&name=${encodeURIComponent(name)}`;SECS=30*60;}
function play(){
  const T=tiles(),t=T[GI];if(!t)return;
  const key=t.sys+':'+t.i,rom=ROMS[key];
  const p=document.getElementById('player');p.classList.remove('hidden');p.classList.add('flex');pname.innerText=t.name;
  if(!rom){emu.removeAttribute('src');emu.contentWindow?.document?.open();emu.contentWindow?.document?.write(`<body style="background:#000;color:#fff;font-family:sans-serif;display:grid;place-items:center;height:100vh"><div style="text-align:center">No ROM linked.<br>Upload your own file to play ${t.name}.</div>`);emu.contentWindow?.document?.close();return;}
  emu.src=`emu.html?core=${SYS[t.sys].core||t.sys}&rom=${encodeURIComponent(rom)}&name=${encodeURIComponent(t.name)}`;
  SECS=30*60;
}
function home(){const p=document.getElementById('player');p.classList.add('hidden');p.classList.remove('flex');emu.removeAttribute('src');cc.classList.add('hidden');}
function toggleCC(){cc.classList.toggle('hidden');}
function fsEmu(){const f=document.getElementById('emu');if(document.fullscreenElement)document.exitFullscreen();else f.requestFullscreen&&f.requestFullscreen();}
setInterval(()=>{if(player.classList.contains('hidden'))return;
  if(SECS>0){SECS--;const m=String(Math.floor(SECS/60)).padStart(2,'0'),s=String(SECS%60).padStart(2,'0');ptimer.innerText=`${m}:${s}`;}
  else ptimer.innerText='Coins play';},1000);
document.addEventListener('keydown',e=>{
  if(!player.classList.contains('hidden')){if(e.key==='Escape')toggleCC();return;}
  if(e.key==='ArrowRight'){const T=tiles();GI=(GI+1)%T.length;draw();}
  if(e.key==='ArrowLeft'){const T=tiles();GI=(GI-1+T.length)%T.length;draw();}
  if(e.key==='ArrowDown'){SI=(SI+1)%SIDS.length;GI=0;draw();}
  if(e.key==='ArrowUp'){SI=(SI-1+SIDS.length)%SIDS.length;GI=0;draw();}
  if(e.key==='Enter')play();
});
document.addEventListener('pointerdown',()=>{const b=document.getElementById('boot');if(b){b.style.opacity=0;setTimeout(()=>b.remove(),850);}});
</script></body></html>
