<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultOS — Retro Gaming OS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap">
<style>html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}
body{background:url('https://images.unsplash.com/photo-1620121692029-d088224ddc74?w=1600&q=60') center/cover,#0b1020}
h1,.sora{font-family:'Sora',sans-serif}
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .6s}
.dicon{width:92px;padding:10px 4px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid transparent}
.dicon:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.win{position:absolute;background:rgba(20,26,43,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(20px)}
.wtitle{cursor:move;user-select:none}
#taskbar{backdrop-filter:blur(24px);background:rgba(20,26,43,.8)}
.tbtn:hover{background:rgba(255,255,255,.12)}
#startmenu{backdrop-filter:blur(24px);background:rgba(20,26,43,.92)}
.sapp:hover{background:rgba(255,255,255,.1)}</style></head>
<body class="text-white">
<div id="boot"><div class="text-center"><i data-lucide="layout-grid" class="w-14 h-14 mx-auto mb-4"></i><div class="sora text-xl">VaultOS</div><div class="text-xs opacity-50 mt-2">loading retro systems…</div></div></div>
<div id="desk" class="h-full pb-14 p-4 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-1 content-start"></div>
<div id="wins"></div>
<div id="startmenu" class="hidden fixed bottom-16 left-1/2 -translate-x-1/2 w-[380px] max-w-[92vw] rounded-2xl border border-white/10 p-4 z-40">
<div class="text-xs opacity-50 mb-2 px-2">Systems</div><div id="sapps" class="grid grid-cols-3 gap-1"></div>
<div class="text-xs opacity-50 mt-3 mb-1 px-2">Games</div><div id="sgames" class="max-h-48 overflow-auto"></div>
<div id="menuad" class="mt-2 rounded-xl border border-dashed border-white/15 text-center text-[11px] opacity-50 py-2.5">AD SLOT</div>
<button onclick="adRewarded(()=>{coins+=50;localStorage.setItem('vo_coins',coins);coinsEl();})" class="mt-2 w-full rounded-xl py-2 text-xs font-bold text-slate-950" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)">Watch ad • +50 coins</button></div>
<div id="taskbar" class="fixed bottom-0 inset-x-0 h-[52px] flex items-center px-3 border-t border-white/10 z-40">
<div class="flex-1"></div>
<div class="flex items-center gap-1">
<button onclick="toggleStart()" class="tbtn rounded-xl p-2" title="Start"><span class="grid place-items-center w-8 h-8 rounded-lg" style="background:linear-gradient(135deg,#38bdf8,#818cf8)"><i data-lucide="layout-grid" class="w-4 h-4 text-slate-950"></i></span></button>
<button onclick="showDesk()" class="tbtn rounded-xl p-2" title="Vault"><i data-lucide="gamepad-2" class="w-5 h-5"></i></button>
<div id="tasks" class="flex gap-1 max-w-[30vw] overflow-auto"></div>
</div>
<div class="flex-1 flex justify-end items-center gap-3 text-xs">
<button onclick="showDesk()" class="tbtn rounded-lg px-2 py-1 opacity-70" title="Show desktop"><i data-lucide="minus-square" class="w-4 h-4"></i></button>
<span class="opacity-70 flex gap-2"><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="volume-2" class="w-4 h-4"></i><i data-lucide="battery-medium" class="w-4 h-4"></i></span>
<span id="clock" class="opacity-90 tabular-nums text-right leading-tight">--:--</span>
<span class="bg-amber-400/15 border border-amber-400/30 rounded-full px-3 py-1 flex items-center gap-1.5"><i data-lucide="coins" class="w-3.5 h-3.5"></i><span id="coins">100</span></span></div></div>
<div id="ctx" class="hidden fixed z-50 bg-[#1c2438]/95 border border-white/10 rounded-xl p-1.5 text-sm w-52 backdrop-blur-xl">
<button onclick="location.reload()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10">Refresh</button>
<button onclick="nextWall();hideCtx()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10">Next background</button>
<button onclick="openSys('gba');hideCtx()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10">Open GBA</button></div>
<script src="ads.js"></script>
<script>
const SYSTEMS=[
{id:'gba',name:'GBA',icon:'gamepad-2',core:'gba',color:'#a855f7',games:[['Pokemon Emerald','RPG'],['Mario Kart SC','Racing'],['Zelda Minish Cap','Adventure'],['Metroid Fusion','Action']]},
{id:'gbc',name:'Game Boy',icon:'joystick',core:'gb',color:'#22d3ee',games:[['Pokemon Crystal','RPG'],['Zelda Links Awakening','Adventure'],['Tetris','Puzzle'],['Mario Land 2','Platformer']]},
{id:'nes',name:'NES',icon:'ghost',core:'nes',color:'#ef4444',games:[['Mario Bros 3','Platformer'],['Contra','Action'],['Zelda','Adventure'],['Tetris','Puzzle']]},
{id:'snes',name:'SNES',icon:'star',core:'snes',color:'#f59e0b',games:[['Mario World','Platformer'],['Zelda LTTP','Adventure'],['Donkey Kong','Platformer'],['Street Fighter','Fighting']]},
{id:'gen',name:'Genesis',icon:'orbit',core:'segaMD',color:'#34d399',games:[['Sonic 2','Platformer'],['Streets of Rage','Action'],['Mortal Kombat','Fighting'],['Aladdin','Platformer']]}];
const ROMS={}; // 'gba:0':'https://.../emerald.gba' — ROM links ekhane
let coins=+(localStorage.getItem('vo_coins')||100),ZW=0;
setTimeout(()=>{boot.style.opacity=0;setTimeout(()=>boot.remove(),650);},1400);
setInterval(()=>{clock.innerText=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});coinsEl();},1000);
function coinsEl(){document.getElementById('coins').innerText=coins;}
desk.innerHTML=SYSTEMS.map(s=>`<div class="dicon" onclick="openSys('${s.id}')"><div class="mx-auto w-12 h-12 rounded-2xl grid place-items-center mb-1" style="background:${s.color}33;border:1px solid ${s.color}66"><i data-lucide="${s.icon}" class="w-6 h-6" style="color:${s.color}"></i></div><div class="text-[11px] font-semibold drop-shadow">${s.name}</div></div>`).join('')+`<div class="dicon" onclick="upload()"><div class="mx-auto w-12 h-12 rounded-2xl grid place-items-center mb-1 bg-white/10 border border-white/20"><i data-lucide="upload" class="w-6 h-6"></i></div><div class="text-[11px] font-semibold drop-shadow">My ROM</div></div><input id="up" type="file" class="hidden">`;
sapps.innerHTML=SYSTEMS.map(s=>`<button onclick="openSys('${s.id}')" class="sapp rounded-xl p-3 text-center"><i data-lucide="${s.icon}" class="w-7 h-7 mx-auto" style="color:${s.color}"></i><div class="text-[11px] mt-1">${s.name}</div></button>`).join('');
lucide.createIcons();
function upload(){up.click();up.onchange=e=>{const f=e.target.files[0];if(!f)return;openGame('custom',f.name,URL.createObjectURL(f),'gb');};}
function openSys(id){const s=SYSTEMS.find(x=>x.id===id);
sgames.innerHTML=s.games.map((g,i)=>`<button onclick="openGame('${id}:${i}','${g[0]}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-white/10 text-sm">${g[0]} <span class="opacity-50 text-xs">• ${g[1]}</span></button>`).join('')+`<div class="text-[11px] opacity-50 px-3 py-1">ROM links not set — upload your own, or add URLs in ROMS{}</div>`;
startmenu.classList.remove('hidden');lucide.createIcons();}
function openGame(key,name,customUrl,customCore){
  startmenu.classList.add('hidden');
  adInterstitial(()=>bootGame(key,name,customUrl,customCore));
}
function bootGame(key,name,customUrl,customCore){
  const [sys,gi]=key.includes(':')?key.split(':'):[customCore||'gba',-1];
  const S=SYSTEMS.find(x=>x.id==sys)||SYSTEMS[0];
  const romUrl=customUrl||ROMS[key];
  const id='w'+(++ZW);
  const w=document.createElement('div');w.id=id;w.className='win';
  w.style.cssText=`left:${40+ZW*28}px;top:${30+ZW*24}px;width:min(640px,94vw);height:min(520px,72vh);z-index:${20+ZW}`;
  w.innerHTML=`<div class="wtitle flex items-center gap-2 px-3 py-2 text-xs font-semibold" style="background:rgba(255,255,255,.06)">
  <i data-lucide="${S.icon}" class="w-4 h-4" style="color:${S.color}"></i><span class="truncate">${name} — ${S.name}</span>
  <span class="ml-auto flex gap-1.5"><button onclick="minWin('${id}')" class="w-7 h-6 rounded-md bg-white/10 grid place-items-center"><i data-lucide="minus" class="w-3 h-3 pointer-events-none"></i></button><button onclick="maxWin('${id}')" class="w-7 h-6 rounded-md bg-white/10 grid place-items-center"><i data-lucide="square" class="w-3 h-3 pointer-events-none"></i></button><button onclick="closeWin('${id}')" class="w-7 h-6 rounded-md bg-red-500/80 grid place-items-center"><i data-lucide="x" class="w-3 h-3 pointer-events-none"></i></button></span></div>
  <div class="flex-1 bg-black relative" id="${id}body"></div>
  <div class="text-[10px] px-3 py-1 opacity-50">30 min free session • coins: <span class="c2">${coins}</span></div>`;
  wins.appendChild(w);tasks.innerHTML+=`<button id="t-${id}" onclick="focusWin('${id}')" class="tbtn text-xs bg-white/10 rounded-lg px-3 py-1.5 truncate max-w-[140px]">${name}</button>`;
  lucide.createIcons();drag(w);
  const body=document.getElementById(id+'body');
  if(!romUrl){body.innerHTML=`<div class="grid place-items-center h-full text-center text-sm opacity-70 p-6">No ROM linked.<br>Upload your own file, or add URL in <b>ROMS['${key}']</b>.</div>`;return;}
  const f=document.createElement('iframe');f.className='w-full h-full border-0';
  f.src=`emu.html?core=${S.core}&rom=${encodeURIComponent(romUrl)}&name=${encodeURIComponent(name)}`;
  body.appendChild(f);
}
function focusWin(id){const w=document.getElementById(id);if(!w)return;w.style.display='flex';w.style.zIndex=++ZW+20;}
function closeWin(id){document.getElementById(id)?.remove();document.getElementById('t-'+id)?.remove();}
function minWin(id){document.getElementById(id).style.display='none';}
function maxWin(id){const w=document.getElementById(id);if(w.dataset.max){delete w.dataset.max;w.style.cssText=w._old||'';}else{w._old=w.style.cssText;w.dataset.max=1;w.style.cssText=`left:0;top:0;width:100vw;height:calc(100vh - 52px);z-index:${++ZW+20};border-radius:0`;}}
function showDesk(){document.querySelectorAll('.win').forEach(w=>w.style.display='none');}
function hideCtx(){document.getElementById('ctx').classList.add('hidden');}
const WALLS=['https://images.unsplash.com/photo-1620121692029-d088224ddc74?w=1600&q=60','https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&q=60','https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1600&q=60'];let WI=0;
function nextWall(){WI=(WI+1)%WALLS.length;document.body.style.backgroundImage=`url('${WALLS[WI]}')`;}
document.addEventListener('contextmenu',e=>{if(e.target.closest('.win'))return;e.preventDefault();const c=document.getElementById('ctx');c.classList.remove('hidden');c.style.left=Math.min(e.clientX,innerWidth-220)+'px';c.style.top=Math.min(e.clientY,innerHeight-160)+'px';});
function drag(el){const h=el.querySelector('.wtitle');let x,y;h.onpointerdown=e=>{if(e.target.closest('button'))return;x=e.clientX-el.offsetLeft;y=e.clientY-el.offsetTop;h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{el.style.left=Math.max(0,ev.clientX-x)+'px';el.style.top=Math.max(0,ev.clientY-y)+'px';};h.onpointerup=()=>h.onpointermove=null;};}
function toggleStart(){document.getElementById('startmenu').classList.toggle('hidden');lucide.createIcons();}
lucide.createIcons();
document.addEventListener('click',e=>{if(!e.target.closest('#startmenu')&&!e.target.closest('#taskbar'))startmenu.classList.add('hidden');});
</script></body></html>
